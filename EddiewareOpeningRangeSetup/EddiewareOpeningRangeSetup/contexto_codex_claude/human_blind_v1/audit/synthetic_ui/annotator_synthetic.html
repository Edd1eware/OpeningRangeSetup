<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUMAN BLIND V1 · Ronda 0</title>
<style>
:root { color-scheme: dark; font-family: Inter, Segoe UI, sans-serif; }
body { margin: 0; background: #08111d; color: #e6edf7; }
main { max-width: 1240px; margin: 0 auto; padding: 18px; }
.hidden { display: none !important; }
.panel { background: #0d1a2a; border: 1px solid #26384d; border-radius: 12px; padding: 16px; }
h1 { margin: 0 0 12px; font-size: 22px; }
h2 { margin: 0 0 10px; font-size: 18px; }
p, li { line-height: 1.45; }
label { display: block; margin: 10px 0; }
button { color: #e6edf7; background: #17304d; border: 1px solid #365575; border-radius: 9px; padding: 12px 16px; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .42; cursor: not-allowed; }
.start { background: #1e6f5c; }
.labels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
.labels button { min-height: 58px; }
.labels button[data-label="A"] { background: #17594a; }
.labels button[data-label="B"] { background: #663c22; }
.labels button[data-label="C"] { background: #35445a; }
.status { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; color: #b8c5d6; }
img { display: block; width: 100%; height: auto; background: #08111d; border-radius: 8px; }
.key { border: 1px solid #59718f; border-radius: 5px; padding: 1px 6px; }
.done { text-align: center; padding: 40px 12px; }
@media (max-width: 700px) { .labels { grid-template-columns: 1fr; } .status { flex-direction: column; } }
</style>
</head>
<body>
<main>
<section id="ack" class="panel">
  <h1>HUMAN_BLIND_V1 · Ronda 0</h1>
  <p>Antes del primer caso confirma la rúbrica congelada.</p>
  <label><input type="checkbox" class="ackbox"> Leí la definición completa de A, B y C.</label>
  <label><input type="checkbox" class="ackbox"> No consultaré reportes, resultados ni datos externos durante esta sesión.</label>
  <label><input type="checkbox" class="ackbox"> Ante duda entre A y B elegiré C; una vez confirmado no hay retroceso.</label>
  <button id="start" class="start" disabled>Confirmar e iniciar</button>
</section>
<section id="task" class="hidden">
  <div class="status"><span id="progress"></span><span>Teclas <span class="key">A</span> <span class="key">B</span> <span class="key">C</span></span></div>
  <div class="panel">
    <h2 id="caseName"></h2>
    <img id="caseImage" alt="Secuencia DOM y tape anonimizada">
    <div class="labels">
      <button data-label="A">A · Absorción limpia</button>
      <button data-label="B">B · Breakout limpio</button>
      <button data-label="C">C · No clasificable</button>
    </div>
  </div>
</section>
<section id="done" class="panel done hidden">
  <h1>Ronda terminada</h1>
  <p>Exporta el CSV y consérvalo sin abrir el mapping administrativo.</p>
  <button id="export" class="start">Exportar etiquetas CSV</button>
</section>
</main>
<script>
"use strict";
const CASES = ["SYN001", "SYN002", "SYN003"];
const ROUND = 0;
const STORE = "human_blind_v1_round_" + ROUND;
const ACK = STORE + "_ack";
const ack = document.getElementById("ack");
const task = document.getElementById("task");
const done = document.getElementById("done");
const start = document.getElementById("start");
const boxes = Array.from(document.querySelectorAll(".ackbox"));
const image = document.getElementById("caseImage");
const caseName = document.getElementById("caseName");
const progress = document.getElementById("progress");
const labels = Array.from(document.querySelectorAll("[data-label]"));
let records = JSON.parse(localStorage.getItem(STORE) || "[]");
let index = records.length;
function acknowledged() { return boxes.every(x => x.checked); }
boxes.forEach(x => x.addEventListener("change", () => start.disabled = !acknowledged()));
function showCurrent() {
  if (index >= CASES.length) {
    task.classList.add("hidden");
    done.classList.remove("hidden");
    return;
  }
  const id = CASES[index];
  progress.textContent = "Caso " + (index + 1) + " de " + CASES.length;
  caseName.textContent = id;
  image.src = "renders/" + id + ".png";
  image.alt = "Secuencia DOM y tape anonimizada " + id;
}
function begin() {
  localStorage.setItem(ACK, new Date().toISOString());
  ack.classList.add("hidden");
  task.classList.remove("hidden");
  showCurrent();
}
start.addEventListener("click", begin);
function commitLabel(label) {
  if (index >= CASES.length || !["A","B","C"].includes(label)) return;
  records.push({
    CaseID: CASES[index],
    label,
    round: ROUND,
    ordinal: index + 1,
    annotated_at: new Date().toISOString()
  });
  localStorage.setItem(STORE, JSON.stringify(records));
  index += 1;
  showCurrent();
}
labels.forEach(button => button.addEventListener("click", () => commitLabel(button.dataset.label)));
document.addEventListener("keydown", event => {
  if (task.classList.contains("hidden")) return;
  const key = event.key.toUpperCase();
  if (["A","B","C"].includes(key)) commitLabel(key);
});
document.getElementById("export").addEventListener("click", () => {
  const header = ["CaseID","label","round","ordinal","annotated_at"];
  const lines = [header.join(",")].concat(records.map(row => header.map(key => row[key]).join(",")));
  const blob = new Blob([lines.join("\n") + "\n"], {type: "text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = "HUMAN_BLIND_V1_ROUND" + ROUND + "_LABELS.csv";
  anchor.click();
  URL.revokeObjectURL(url);
});
if (localStorage.getItem(ACK)) {
  ack.classList.add("hidden");
  task.classList.remove("hidden");
  showCurrent();
}
</script>
</body>
</html>
